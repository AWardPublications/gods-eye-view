name: DaVinciA+ Milestone Recognition Ceremony

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  certify-milestone:
    name: Certify Milestone Evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@1d93f7d24693a2a5962f834d501d628d2bebebe2 # v4.2.1

      - name: Set up Node.js
        uses: actions/setup-node@39376e3e73fc7acd457e5b228965c9c6f212c41f # v4.1.0
        with:
          node-version: 22

      - name: Clean Install Dependencies
        run: npm ci

      - name: Run Milestone Ceremony Runner
        run: node tools/recognize-milestone.js
